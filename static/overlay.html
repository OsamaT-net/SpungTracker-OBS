<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif;
  }

  /* ── Speech bubble ── */
  #bubble {
    position: absolute;
    background: #ffffff;
    border-radius: 20px;
    padding: 12px 20px;
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    border: 3px solid #e8e8e8;

    /* Anchor: horizontal center, bottom of bubble above the object */
    transform: translate(-50%, -115%);

    /* Smooth position tracking */
    transition: left 0.08s linear, top 0.08s linear;

    /* Show/hide */
    opacity: 0;
    scale: 0.7;
    transition:
      left   0.08s linear,
      top    0.08s linear,
      opacity 0.25s ease,
      scale   0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #bubble.visible {
    opacity: 1;
    scale: 1;
  }

  /* Tail pointing downward */
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    border: 14px solid transparent;
    border-top-color: #e8e8e8;
    border-bottom: none;
  }
  #bubble::before {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    border: 13px solid transparent;
    border-top-color: #ffffff;
    border-bottom: none;
    z-index: 1;
  }

  /* ── Frog indicator dot (shows when frog is detected but no alert) ── */
  #dot {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid white;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: left 0.08s linear, top 0.08s linear, opacity 0.3s ease;
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
  }
  #dot.visible { opacity: 1; }
</style>
</head>
<body>

<div id="bubble">🎉 Welcome!</div>
<div id="dot"></div>

<script>
  const CANVAS_W = 1920;
  const CANVAS_H = 1080;
  const WS_URL   = "ws://localhost:8765/ws";

  const bubble  = document.getElementById("bubble");
  const dot     = document.getElementById("dot");

  let hideTimer  = null;
  let liveCX     = 0.5;   // live tracking position (for dot indicator)
  let liveCY     = 0.3;

  // ── WebSocket connection with auto-reconnect ──────────────────────────────
  function connect() {
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => console.log("[overlay] Connected to server");

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }

      const { bbox, alerts } = data;

      // Update live dot position (tracker indicator only, bubble doesn't follow)
      if (bbox && bbox.visible) {
        liveCX = bbox.cx;
        liveCY = bbox.cy;
        moveDot(liveCX, liveCY);
        dot.classList.add("visible");
      } else {
        dot.classList.remove("visible");
      }

      // Show alert — bubble snaps to position captured at sub time
      if (alerts && alerts.length > 0) {
        const alert = alerts[0];
        // Use snapped_bbox if available, else fall back to current live position
        const bx = alert.snapped_bbox || (bbox && bbox.visible ? bbox : null);
        const cx = bx ? bx.cx : liveCX;
        const cy = bx ? bx.cy : liveCY;
        showBubble(alert.message, alert.duration, cx, cy);
      }
    };

    ws.onclose = () => {
      console.log("[overlay] Disconnected — retrying in 2s...");
      setTimeout(connect, 2000);
    };

    ws.onerror = (err) => {
      console.warn("[overlay] WebSocket error", err);
      ws.close();
    };
  }

  // ── Position helpers ──────────────────────────────────────────────────────
  function moveDot(cx, cy) {
    // Only the dot tracks live — bubble is static per alert
    dot.style.left = (cx * CANVAS_W) + "px";
    dot.style.top  = (cy * CANVAS_H) + "px";
  }

  // ── Alert display — bubble is locked to snapped position ──────────────────
  function showBubble(message, durationMs = 6000, cx = 0.5, cy = 0.3) {
    bubble.textContent = message;

    // Lock bubble to the frog's position at the moment of the sub event
    bubble.style.left = (cx * CANVAS_W) + "px";
    bubble.style.top  = (cy * CANVAS_H) + "px";

    bubble.classList.add("visible");

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      bubble.classList.remove("visible");
    }, durationMs);
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  moveDot(liveCX, liveCY);
  connect();
</script>

</body>
</html>
