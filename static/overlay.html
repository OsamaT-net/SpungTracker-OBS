<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif;
  }

  #bubble {
    position: absolute;
    background: #ffffff;
    border-radius: 20px;
    padding: 12px 20px;
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    border: 3px solid #e8e8e8;
    transform: translate(-50%, -115%);
    /* font-size and padding set dynamically by JS from alert payload */
    opacity: 0;
    scale: 0.7;
    transition:
      left    0.1s linear,
      top     0.1s linear,
      opacity 0.25s ease,
      scale   0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #bubble.visible {
    opacity: 1;
    scale: 1;
  }

  #bubble::after {
    content: '';
    position: absolute;
    bottom: -18px; left: 50%;
    transform: translateX(-50%);
    border: 14px solid transparent;
    border-top-color: #e8e8e8;
    border-bottom: none;
  }
  #bubble::before {
    content: '';
    position: absolute;
    bottom: -14px; left: 50%;
    transform: translateX(-50%);
    border: 13px solid transparent;
    border-top-color: #ffffff;
    border-bottom: none;
    z-index: 1;
  }

  #dot {
    position: absolute;
    width: 14px; height: 14px;
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid white;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: left 0.08s linear, top 0.08s linear, opacity 0.3s ease;
    box-shadow: 0 0 8px rgba(34,197,94,0.6);
  }
  #dot.visible { opacity: 1; }
</style>
</head>
<body>

<div id="bubble"></div>
<div id="dot"></div>
<audio id="sub-sound" preload="auto"></audio>

<script>
  const CANVAS_W = 1920;
  const CANVAS_H = 1080;
  const WS_URL   = `ws://${location.hostname || 'localhost'}:8765/ws`;

  const bubble = document.getElementById("bubble");
  const dot    = document.getElementById("dot");

  let hideTimer  = null;
  let isVisible  = false;
  let followMode = false;
  let lastCX     = 0.5;
  let lastCY     = 0.3;

  function moveBubbleTo(cx, cy) {
    lastCX = cx;
    lastCY = cy;
    bubble.style.left = (cx * CANVAS_W) + "px";
    bubble.style.top  = (cy * CANVAS_H) + "px";
  }

  function playSound() {
    const audio = document.getElementById("sub-sound");
    if (audio.src && audio.src !== window.location.href) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
  }

  function showBubble(message, durationMs, cx, cy, follow, fontSize, padding) {
    bubble.textContent = message;
    bubble.style.fontSize = fontSize + "px";
    bubble.style.padding  = padding + "px " + (padding * 1.67 | 0) + "px";
    followMode = follow;
    moveBubbleTo(cx, cy);
    bubble.classList.add("visible");
    isVisible = true;

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      bubble.classList.remove("visible");
      isVisible  = false;
      followMode = false;
    }, durationMs);
  }

  function connect() {
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => console.log("[overlay] Connected to", WS_URL);

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }

      const { bbox, alerts } = data;

      // Always update dot + track last known bbox position
      if (bbox && bbox.visible) {
        dot.style.left = (bbox.cx * CANVAS_W) + "px";
        dot.style.top  = (bbox.cy * CANVAS_H) + "px";
        dot.classList.add("visible");

        // If bubble is visible and follow mode is on, move it with the frog
        if (isVisible && followMode) {
          moveBubbleTo(bbox.cx, bbox.cy);
        }
      } else {
        dot.classList.remove("visible");
      }

      // Handle incoming alert
      if (alerts && alerts.length > 0) {
        const alert = alerts[0];
        const follow = alert.follow === true;

        // Use snapped position from server as starting point
        let cx = lastCX;
        let cy = lastCY;
        if (alert.snapped_bbox && typeof alert.snapped_bbox.cx === "number") {
          cx = alert.snapped_bbox.cx;
          cy = alert.snapped_bbox.cy;
        } else if (bbox && bbox.visible) {
          cx = bbox.cx;
          cy = bbox.cy;
        }

        if (alert.play_sound) playSound();
        showBubble(
          alert.message,
          alert.duration,
          cx, cy,
          follow,
          alert.font_size  || 28,
          alert.padding    || 12
        );
      }
    };

    ws.onclose = () => {
      console.log("[overlay] Disconnected — retrying in 2s");
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
  }

  // Pre-load sound from server
  const audio = document.getElementById("sub-sound");
  audio.src = `http://${location.hostname || 'localhost'}:8765/sound`;

  moveBubbleTo(lastCX, lastCY);
  connect();
</script>

</body>
</html>
